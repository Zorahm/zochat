name: Publish zoChat JAR and badge packs to release

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach the JAR to'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: echo "tag=${INPUT_TAG:-${GITHUB_REF_NAME}}" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon

      # One pack per style. The build above already failed if the committed badges.yml in the jar
      # is stale, so these packs and the jar agree on every badge character.
      - name: Build the badge resource packs
        run: ./gradlew :prefixgen:run --no-daemon

      - name: Attach JAR and resource packs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # A tag push has no release yet; a published-release run already has one.
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          # --clobber so re-running the workflow replaces the assets instead of failing.
          gh release upload "$TAG" build/libs/zoChat-*.jar tools/prefixgen/build/resourcepack/zochat-badges-*.zip --clobber
