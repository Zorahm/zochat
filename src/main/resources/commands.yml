# ═══════════════════════════════════════════════════════════════
#  zoChat — Запрещённые команды (только из консоли)
#  Игроки не смогут выполнять перечисленные команды. Консоль и
#  командные блоки не затрагиваются. Обойти может только игрок с
#  правом  zochat.command.bypass  (по умолчанию — операторы).
# ═══════════════════════════════════════════════════════════════

# Главный выключатель всей системы.
enabled: true

# Список запрещённых команд БЕЗ слэша.
# Namespace-формы (minecraft:op, bukkit:seed) блокируются автоматически,
# пока включён block-namespaced ниже.
blocked:
  - op
  - deop
  - stop
  - reload
  - seed

# Блокировать обход через namespace-префикс: /minecraft:op == /op.
# Рекомендуется держать включённым — иначе фильтр тривиально обходится.
block-namespaced: true

# Прятать запрещённые команды из подсказок клиента (таб-комплит),
# чтобы игроки их даже не видели.
hide-from-tab: true

# Что делать при попытке выполнить запрещённую команду (кроме отмены).
notify:
  message: true       # отправить игроку сообщение (текст — в messages_*.yml)
  console-log: true   # записать попытку в консоль сервера (для аудита)
  sound: true         # проиграть игроку звук отказа

# Звук отказа. Формат ключа: block.note_block.bass  или  BLOCK_NOTE_BLOCK_BASS.
sound: "block.note_block.bass"
