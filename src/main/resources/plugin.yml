name: zoChat
version: '${version}'
main: zorahm.zochat.ZoChatPlugin
api-version: 1.21
description: Enhanced chat plugin with local/global chat, mentions (@everyone/@here), smart placeholders, advanced word filter, and more.
author: ZorahM
website: https://github.com/Zorahm/zochat
depend:
  - LuckPerms
softdepend:
  - PlaceholderAPI
commands:
  chat:
    description: Manage chat settings
    usage: /<command> [reload]
    aliases: [zochat]
  global:
    description: Send a message to global chat
    usage: /<command> <message>
    aliases: [g]
    permission: zochat.global
  local:
    description: Send a message to local chat
    usage: /<command> <message>
    aliases: [l]
    permission: zochat.local
  msg:
    description: Send a private message to a player
    usage: /<command> <player> <message>
    aliases: [m, tell, w]
    permission: zochat.msg
  reply:
    description: Reply to the last private message
    usage: /<command> <message>
    aliases: [r]
    permission: zochat.msg
  chatlog:
    description: View and clear chat logs
    usage: /<command> <player|clear>
    permission: zochat.admin
  bubble:
    description: Show a floating bubble above your head
    usage: /<command> <message>
    aliases: [b]
    permission: zochat.bubble
permissions:
  zochat.admin:
    description: Access to admin commands (e.g. /chat reload)
    default: op
  zochat.global:
    description: Access to global chat
    default: true
  zochat.local:
    description: Access to local chat
    default: true
  zochat.msg:
    description: Access to private messages
    default: true
  zochat.bubble:
    description: Access to the /bubble command
    default: true
  zochat.spam.bypass:
    description: Bypass anti-spam cooldowns
    default: op
  zochat.command.bypass:
    description: Allows running blocked (console-only) commands
    default: op
  zochat.stealth.join:
    description: Hides the join message
    default: op
  zochat.stealth.quit:
    description: Hides the quit message
    default: op
  zochat.mention.everyone:
    description: Access to mentioning all players with @everyone
    default: op
  zochat.mention.here:
    description: Access to mentioning nearby players with @here
    default: op
  zochat.placeholder.loc:
    description: Access to the ^loc placeholder (coordinates)
    default: true
  zochat.placeholder.world:
    description: Access to the ^world placeholder (world)
    default: true
  zochat.placeholder.time:
    description: Access to the ^time placeholder (time)
    default: true
  zochat.placeholder.health:
    description: Access to the ^health placeholder (health)
    default: true
  zochat.placeholder.ping:
    description: Access to the ^ping placeholder (ping)
    default: true
  zochat.placeholder.biome:
    description: Access to the ^biome placeholder (biome)
    default: true
  zochat.placeholder.item:
    description: Access to the ^item placeholder (item in hand)
    default: true
  zochat.placeholder.papi:
    description: Allows expanding PlaceholderAPI placeholders (%...%) in your own messages
    default: op
