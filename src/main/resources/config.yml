# ════════════════════════════════════════════
#            zoChat Configuration
# ════════════════════════════════════════════

debug-mode: false

# Message language
message: ru

# Prefix for /chat command replies (reload, unknown subcommand)
message-prefix: "<#d45079>zoChat</#d45079> <#c0c0c0>•</#c0c0c0> "

# ───── Anti-spam settings ─────
anti-spam:
  enabled: true                        # Enable anti-spam to limit message frequency
  local-cooldown: 3                    # Cooldown for local chat (in seconds)
  global-cooldown: 5                   # Cooldown for global chat (in seconds)
  private-cooldown: 2                  # Cooldown for private messages (in seconds)
  bubble-cooldown: 3                   # Cooldown for /bubble (in seconds)
  bypass-permission: "zochat.spam.bypass" # Permission to bypass anti-spam

# ───── Banned words filter settings ─────
banned-words:
  enabled: true                        # Enable banned words filtering
  mode: "smart"                        # Filter mode: "exact", "contains", "smart" (smart check with normalization)
  action: "block"                      # Action: "block" (block message), "replace" (replace with ***)
  normalize: true                      # Normalize leet/Cyrillic (h3ll0 → hello). Disable on false positives
  words: []                            # List of banned words (e.g., ["bad_word", "regex:\\b\\d{4}-\\d{4}-\\d{4}-\\d{4}\\b"])
                                       # For regex patterns use the "regex:" prefix (e.g., "regex:\\b(bad|word)\\b")

# ───── Mention settings ─────
mention:
  # Regular mention @PlayerName
  format: "<yellow><bold>@{player}</bold></yellow>"  # Mention highlight format
  sound: "ENTITY_EXPERIENCE_ORB_PICKUP"              # Mention sound
  # Action bar notification texts live in messages/messages_*.yml (mention.notify*)

  # @everyone mention - mentions all players on the server
  everyone-permission: "zochat.mention.everyone"    # Permission to use @everyone
  everyone-format: "<red><bold>@everyone</bold></red>"  # @everyone display format

  # @here mention - mentions nearby players
  here-permission: "zochat.mention.here"            # Permission to use @here
  here-format: "<gold><bold>@here</bold></gold>"    # @here display format
  here-radius: 100                                  # @here radius (in blocks)

# ───── Local chat settings ─────
# Chat, private-message and join/quit formats live in messages/messages_*.yml (formats.*),
# so they follow the "message:" language.
# With local chat on, plain chat goes local and "!message" goes global.
# If BOTH local and global chat are disabled, zoChat leaves chat to vanilla.
local-chat:
  enabled: true                        # Enable local chat
  radius: 50                           # Local chat radius

# ───── Global chat settings ─────
global-chat:
  enabled: true                        # Enable global chat ("!message" and /g)

# ───── /say formatting ─────
say:
  enabled: true                        # Format vanilla /say output like chat (off = untouched)
  # Tokens: {prefix} (console prefix; put in front when missing), {player}, {message}.
  # Player /say escapes the text (no injection); console /say parses it as MiniMessage.
  format: "{prefix}<gradient:#ffaa33:#ffd700>[{player}]</gradient> <#c0c0c0>›</#c0c0c0> <white>{message}</white>"
  # Format for /say from the console, command blocks and RCON. Blank = use format above.
  # E.g. "{prefix}<#c0c0c0>›</#c0c0c0> <white>{message}</white>" shows only the console badge, without the name.
  console-format: ""

# ───── Console ─────
# How the console appears in /say and in private messages (/msg and /reply from the console).
console:
  # MiniMessage. Set in game with /chat consoleprefix <prefix|clear>.
  prefix: "<badge:console> "
  name: "Server"                       # blank = show only the prefix, e.g. just the badge

# ───── Rank badges ─────
# <badge:id> inserts a badge from the zoChat resource pack (built by tools/prefixgen), e.g. <badge:admin>
# in a LuckPerms prefix or <badge:console> above. <badge:admin:ru-icon> picks a variant: en, en-icon, ru, ru-icon.
# The console always gets a text label like [ADMIN] instead of the glyph.
badges:
  enabled: false                       # true once players get the resource pack; false = text labels for everyone
  language: auto                       # auto (follows message:), en or ru
  icons: true                          # badges with the rank icon

# ───── Offline message settings ─────
offline-messages:
  enabled: true

# ───── Database settings for chat logging ─────
database:
  type: "sqlite"                        # Choose database type: "sqlite" or "mysql"
  mysql:
    host: "localhost"                    # MySQL server address
    port: 3306                           # MySQL server port
    database: "minecraft_chat"           # Database name
    username: "root"                     # Username for connection
    password: "password"                 # Database password

# ───── DiscordSRV ─────
# Needs the DiscordSRV plugin. zoChat cancels chat events, so DiscordSRV can't pick chat up on its
# own; zoChat hands each message over instead. Keep DiscordSRV's RespectChatPlugins: true, or global
# chat reaches Discord twice. Channel names are DiscordSRV game channels (Channels: in its config.yml).
discordsrv:
  enabled: true                        # send chat to Discord and format Discord messages
  global-channel: "global"             # game channel for global chat
  local-chat: false                    # also send local chat to Discord
  local-channel: "global"              # game channel for local chat; map a separate one to keep them apart
  discord-format: true                 # format Discord -> Minecraft messages with formats.discord (messages_*.yml);
                                       # false = leave them to DiscordSRV's own DiscordToMinecraft format
  max-length: 256                      # longer Discord messages are cut

# ───── Join and quit message settings ─────
join-message:
  enabled: false                        # Replace the join message (false = vanilla message untouched)
  sound: "ENTITY_PLAYER_LEVELUP"       # Join sound (optional)
  stealth-permission: "zochat.stealth.join"  # Permission to hide join message

quit-message:
  enabled: false                        # Replace the quit message (false = vanilla message untouched)
  sound: "ENTITY_VILLAGER_NO"          # Quit sound (optional)
  stealth-permission: "zochat.stealth.quit"  # Permission to hide quit message

# ───── Smart placeholder settings (^loc, ^world, ...) ─────
# Moved to placeholders.yml — built-in/custom ^ placeholders and world-name translation.

# ───── PlaceholderAPI integration ─────
# Expands external %...% placeholders (e.g. %vault_prefix%, %player_world%).
# No effect unless the PlaceholderAPI plugin is installed. zoChat also registers
# its own %zochat_...% placeholders for other plugins to read.
placeholder-api:
  enabled: true                        # Master toggle for PlaceholderAPI integration
  format: true                         # Expand %...% in chat formats. Values are parsed as MiniMessage, so avoid placeholders that return player-typed text (e.g. nicknames)
  player-messages: false               # Expand %...% players type in their own messages (abuse risk — opt-in)
  player-permission: "zochat.placeholder.papi"  # Permission required for player-message expansion