# Errors
errors:
  only-players: "<red>This command is for players only!</red>"
  no-permission: "<red>You do not have permission to do that!</red>"

# Private messages (/msg and /reply)
private-messages:
  usage: "<red>Usage: /msg <player> <message></red>"
  player-not-found: "<red>Player {player} not found or offline!</red>"
  offline-sent: "<green>Message sent to {player} (offline).</green>"
  offline-disabled: "<red>Offline messages are disabled.</red>"
  offline-full: "<red>{player} has too many unread messages. Try again later.</red>"
  offline-failed: "<red>Could not save the message for {player}. Try again later.</red>"
  self: "<red>You can't message yourself!</red>"

# /bubble command
bubble:
  usage: "<red>Usage: /bubble <message></red>"
  disabled: "<red>Bubble messages are disabled.</red>"

# /reply command
reply:
  usage: "<red>Usage: /reply <message></red>"
  no-target: "<red>No one to reply to! Send a message with /msg first.</red>"
  target-offline: "<red>The player you want to reply to is offline!</red>"

# Chat messages
chat:
  spam-warning: "<red>Don't spam! Wait a bit before sending another message.</red>"
  local-disabled: "<red>Local chat is disabled on the server!</red>"
  global-disabled: "<red>Global chat is disabled on the server!</red>"
  message-player: "Message {player} privately"
  message-timestamp: "Sent at: {time}"
  message-reply-hover: "<gray>Click to reply</gray>"
  message-resend-hover: "<gray>Click to send another message</gray>"
  reload-success: "<green>The plugin configuration has been successfully reloaded.</green>"
  unknown-subcommand: "<red>Unknown subcommand. Use /chat help.</red>"
  banned-word: "<red>Message contains banned words!</red>"
  offline-messages-header: "<gray>You have {count} unread message(s):</gray>"
  chat-help:
    - ""
    - "<bold><gradient:#ff6b6b:#ffa3a3>🌀 ZoChat Help</gradient></bold>"
    - "<gray><italic>Hover a command to see details</italic></gray>"
    - ""
    - "<#70a1ff>📜 Main commands</#70a1ff>"
    - "  <hover:show_text:'<gray>Reloads config and messages'><gray>• /chat reload</gray></hover> — <white>Reload chat</white>"
    - "  <hover:show_text:'<gray>Shows this menu'><gray>• /chat help</gray></hover> — <white>Help</white>"
    - ""
    - "<#ff9ff3>✉️ Private messages</#ff9ff3>"
    - "  <hover:show_text:'<gray>Send a PM to a player\n<white>Example:</white> <gray>/msg Nick Hi!'><gray>• /msg <player> <message></gray></hover> — <white>Private message</white>"
    - "  <hover:show_text:'<gray>Reply to the last PM\n<white>Example:</white> <gray>/reply Thanks!'><gray>• /reply <message></gray></hover> — <white>Quick reply</white>"
    - ""
    - "<#feca57>🌍 Chat types</#feca57>"
    - "  <hover:show_text:'<gray>Visible to everyone\n<white>Example:</white> <gray>/g Hello all!'><gray>• /g <message></gray></hover> — <white>Global</white>"
    - "  <hover:show_text:'<gray>Visible only nearby\n<white>Example:</white> <gray>/l Where are you?'><gray>• /l <message></gray></hover> — <white>Local</white>"
    - ""
    - "<#a4b0be>🔗 Extra</#a4b0be>"
    - "  <hover:show_text:'<gray>Mention a player in any chat\n<white>Example:</white> <gray>Hi, @Nick!</gray>'><gray>• @Player</gray></hover> — <white>Mention</white>"
    - ""

# /chatlog
chatlog:
  usage: "<red>Usage: /chatlog <player|clear></red>"
  header: "<gray>--- Recent messages by {player} ---</gray>"
  message: "<gray>• {message}</gray>"
  "no-messages": "<gray>No messages found.</gray>"
  cleared: "<green>Cleared {count} chat log entries.</green>"
  error: "<red>Database error.</red>"

# Blocked commands (console-only)
command-guard:
  blocked: "<red>This command can only be run from the console.</red>"

# Placeholders
placeholders:
  empty-hand: "empty"
